name: Publier une version

# Pousser un tag vX.Y.Z suffit : GitHub construit l'installateur et le publie.
# Les applications déjà installées voient la nouvelle version toutes seules au
# démarrage suivant — personne n'a de commande à lancer.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run check

      - name: Lancer les tests
        run: npm test

      # Le tag et package.json doivent décrire la même version, sinon les
      # clients téléchargeraient un installateur qui ne correspond pas.
      - name: Contrôler la version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v') {
            Write-Host "Déclenchement manuel : contrôle de tag ignoré."
            exit 0
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $tag) {
            Write-Error "Le tag $tag ne correspond pas à la version $version de package.json."
            exit 1
          }
          Write-Host "Version $version confirmée."

      - name: Construire l'installateur
        run: npm run package:win

      # publish-release.mjs refuse un lot incohérent : manifeste absent, version
      # divergente ou taille qui ne correspond pas à l'installateur.
      - name: Publier sur GitHub Releases
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Conserver l'installateur en artefact
        uses: actions/upload-artifact@v4
        with:
          name: STRYKER-Setup-x64
          path: |
            release/STRYKER-Setup-x64.exe
            release/latest.yml
          retention-days: 14
