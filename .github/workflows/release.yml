name: Publier une version

# Pousser un tag vX.Y.Z suffit : GitHub construit l'installateur et le publie.
# Les applications déjà installées voient la nouvelle version toutes seules au
# démarrage suivant — personne n'a de commande à lancer.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier les types
        run: npm run check

      - name: Lancer les tests
        run: npm test

      # Le tag et package.json doivent décrire la même version, sinon les
      # clients téléchargeraient un installateur qui ne correspond pas.
      - name: Contrôler la version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v') {
            Write-Host "Déclenchement manuel : contrôle de tag ignoré."
            exit 0
          }
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne $tag) {
            Write-Error "Le tag $tag ne correspond pas à la version $version de package.json."
            exit 1
          }
          Write-Host "Version $version confirmée."

      # Les archives tierces du catalogue intégré ne sont pas dans le dépôt
      # public. Sans elles l'installateur se construit quand même, mais les mods
      # concernés disparaissent de l'application : on ne publie pas ça.
      - name: Vérifier le catalogue intégré
        id: bundled
        shell: pwsh
        run: |
          $catalog = "bundled-mods/catalog.json"
          if (-not (Test-Path $catalog)) {
            "complete=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            exit 0
          }
          $missing = @()
          foreach ($entry in (Get-Content $catalog -Raw | ConvertFrom-Json)) {
            if (-not (Test-Path (Join-Path "bundled-mods" $entry.archiveFile))) {
              $missing += $entry.archiveFile
            }
          }
          if ($missing.Count -gt 0) {
            Write-Warning "Archives intégrées absentes : $($missing -join ', ')"
            "complete=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "complete=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Construire l'installateur
        run: npm run package:win

      # publish-release.mjs refuse en plus un lot incohérent : manifeste absent,
      # version divergente ou taille qui ne correspond pas à l'installateur.
      - name: Publier sur GitHub Releases
        if: steps.bundled.outputs.complete == 'true'
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publication ignorée
        if: steps.bundled.outputs.complete != 'true'
        shell: pwsh
        run: |
          $message = "Publication ignoree : les archives du catalogue integre manquent sur le runner. " +
            "L'installateur construit ici est incomplet et n'a pas ete publie. " +
            "Publiez depuis une machine disposant de bundled-mods/ avec « npm run release »."
          Write-Warning $message
          "## Publication ignorée`n`n$message" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Conserver l'installateur en artefact
        uses: actions/upload-artifact@v4
        with:
          name: STRYKER-Setup-x64
          path: |
            release/STRYKER-Setup-x64.exe
            release/latest.yml
          retention-days: 14
